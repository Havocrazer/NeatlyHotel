name: NeatlyHotel
description: A hotel booking management system with user authentication, room booking, and admin features.

project_type: Full-stack Web Application

tech_stack:
  frontend:
    - React 18
    - Vite (build tool)
    - React Router DOM
    - Tailwind CSS
    - Material UI (MUI)
    - Swiper (carousel)
    - Firebase (authentication)
    - Supabase (storage/database)
    - Axios (HTTP client)
    - React Hook Form

  backend:
    - Node.js
    - Express.js
    - Prisma (ORM)
    - PostgreSQL (database)
    - JWT (authentication)
    - Cloudinary (image storage)
    - Multer (file upload)
    - bcrypt (password hashing)

  dev_tools:
    - Docker & Docker Compose
    - Nodemon (server auto-reload)

