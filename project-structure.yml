api_endpoints:
  admin:
    - POST /api/admin/auth/login
    - GET /api/admin
    - PUT /api/admin/rooms/:id
    - DELETE /api/admin/rooms/:id

  users:
    - POST /api/users/register
    - POST /api/users/login
    - GET /api/users/profile
    - PUT /api/users/profile

  hotel:
    - GET /api/hotel/rooms
    - GET /api/hotel/room-detail/:id

  booking:
    - POST /api/booking
    - GET /api/booking/history
    - PUT /api/booking/cancel/:id
    - PUT /api/booking/change-date/:id
    - PUT /api/booking/refund/:id

  status:
    - GET /api/status

database_models:
  - User
  - Booking
  - Room
  - RoomType
  - RoomImage
  - RoomStatus
  - BedType
  - BookingRequest
  - Hotel

features:
  user_side:
    - User registration and login
    - Room search and filtering
    - Room detail view with image gallery
    - Room booking and payment
    - Booking history management
    - Booking cancellation
    - Booking date change
    - Profile management

  admin_side:
    - Admin login
    - Room management (CRUD)
    - Room type management
    - Customer booking management
    - Booking detail view
